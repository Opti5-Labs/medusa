# Medusa — nginx site config. Installed by deploy/setup.sh to
# /etc/nginx/sites-available/medusa. SERVER_NAME is replaced at install time.
#
# /api     -> FastAPI on 127.0.0.1:8000 (single worker: run state is in memory)
# /        -> Next.js on 127.0.0.1:3000

limit_req_zone $binary_remote_addr zone=medusa_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name SERVER_NAME;

    # Zip uploads are capped at 20 MB by the backend; leave a little headroom.
    client_max_body_size 21m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    # Live event streams: no buffering, long-lived connections.
    location ~ ^/api/(repro|debug|ask)/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        add_header X-Accel-Buffering no;
    }

    location /api/ {
        limit_req zone=medusa_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The backend trusts only the last entry, which nginx appends.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

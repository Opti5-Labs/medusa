# Egress proxy for the dependency-install phase of general-repo execution.
# The install container sits on an internal Docker network with no route out;
# this proxy is its only way to the internet, and it only allows PyPI over TLS.
http_port 3128

acl pypi dstdomain .pypi.org .pythonhosted.org
acl SSL_ports port 443
acl CONNECT method CONNECT

http_access deny CONNECT !SSL_ports
http_access allow CONNECT pypi
http_access deny all

# Cap any single download and keep nothing on disk.
reply_body_max_size 200 MB
cache deny all

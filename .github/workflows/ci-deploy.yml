# CI on every pull request and push; deploy to EC2 when main passes.
#
# Deploy uses GitHub OIDC to assume an AWS role that can only send a run-command
# to the Medusa instance (no AWS keys or SSH keys in GitHub). The instance then
# runs deploy/deploy.sh <sha>, which checks out that commit of main and runs
# deploy/setup.sh. One-time setup: deploy/README.md, "Automatic deploys".
#
# Repository variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, EC2_INSTANCE_ID, DEPLOY_URL

name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      # Sandbox container tests skip here (no sandbox image); everything else runs.
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy ${{ github.sha }} via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "medusa deploy ${SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters "{\"commands\":[\"bash /opt/medusa/deploy/deploy.sh $SHA\"],\"executionTimeout\":[\"1800\"]}" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          status=Pending
          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -40
          if [ "$status" != "Success" ]; then
            echo "::error::deploy finished with status $status"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -40
            exit 1
          fi

      - name: Health check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: curl -fsS --retry 5 --retry-delay 5 "$DEPLOY_URL/api/health"

# CI on every pull request and push; deploy to EC2 when main passes.
#
# Deploy uses GitHub OIDC to assume an AWS role that can only upload release
# archives and send a run-command to the Medusa instance (no AWS keys or SSH
# keys in GitHub). The workflow uploads `git archive` of the commit to a private
# S3 bucket and gives the instance a 15-minute download link; the instance runs
# that archive's deploy/deploy.sh, which syncs the code and runs setup.sh. The
# server needs no GitHub or S3 credentials. Setup: deploy/README.md.
#
# Repository variables: AWS_DEPLOY_ROLE_ARN, AWS_REGION, EC2_INSTANCE_ID,
# RELEASE_BUCKET, DEPLOY_URL

name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: ruff format --check .
      # Sandbox container tests skip here (no sandbox image); everything else runs.
      - run: python -m pytest -q -p no:cacheprovider

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ""
          NEXT_TELEMETRY_DISABLED: "1"

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for AWS
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload release archive
        id: release
        env:
          BUCKET: ${{ vars.RELEASE_BUCKET }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git archive --format=tar.gz -o release.tar.gz "$SHA"
          aws s3 cp --only-show-errors release.tar.gz "s3://$BUCKET/releases/$SHA.tar.gz"
          # Short-lived link: the server needs no S3 or GitHub credentials.
          url=$(aws s3 presign "s3://$BUCKET/releases/$SHA.tar.gz" --expires-in 900)
          echo "::add-mask::$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ github.sha }} via SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          SHA: ${{ github.sha }}
          URL: ${{ steps.release.outputs.url }}
        run: |
          set -euo pipefail
          # Run the deploy.sh from this commit's archive, not whatever is on the server.
          script="set -eu; a=\$(mktemp); d=\$(mktemp); trap 'rm -f \"\$a\" \"\$d\"' EXIT; curl -fsS --retry 3 -o \"\$a\" '$URL'; tar -xzOf \"\$a\" deploy/deploy.sh > \"\$d\"; bash \"\$d\" $SHA '$URL'"
          params=$(jq -nc --arg c "$script" '{commands: [$c], executionTimeout: ["1800"]}')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "medusa deploy ${SHA:0:7}" \
            --timeout-seconds 600 \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command: $CMD_ID"
          status=Pending
          for _ in $(seq 1 180); do
            sleep 10
            status=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text | tail -40
          if [ "$status" != "Success" ]; then
            echo "::error::deploy finished with status $status"
            aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query StandardErrorContent --output text | tail -40
            exit 1
          fi

      - name: Health check
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: curl -fsS --retry 5 --retry-delay 5 "$DEPLOY_URL/api/health"
